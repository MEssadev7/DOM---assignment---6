<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Form Validation</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h3>Task 1: Prevent Form Submission</h3>

    <form id="myForm">
      <input type="text" id="name" placeholder="Enter your name" />
      <br /><br />
      <button type="submit">Submit the form</button>
    </form>

    <hr />

    <h3>Task 2: Required Field Validation</h3>

    <form id="Form2">
      <input type="text" id="name1" placeholder="Enter your name" />
      <br /><br />
      <button type="submit">Submit</button>
    </form>

    <hr />

    <h3>Task 3: Email Validation</h3>

    <form id="Form3">
      <input type="email" id="email1" placeholder="Enter your email" />
      <br /><br />
      <button type="submit">Submit</button>
    </form>

    <hr />

    <h3>Task 4: Password Validation</h3>

    <form id="Form4">
      <input type="password" id="password1" placeholder="Enter your password" />
      <br /><br />
      <button type="submit">Submit</button>
    </form>

    <hr />

    <h3>Task 5: Show Error Message in DOM</h3>
    <form id="myForm1" novalidate>
      <input type="text" id="username" placeholder="Enter your name" />
      <span class="error-msg" id="nameError"></span>

      <input type="email" id="email" placeholder="Enter your email" />
      <span class="error-msg" id="emailError"></span>

      <button type="submit">Submit</button>
      <button type="button" id="resetBtn">Reset</button>
    </form>

    <p id="statusMsg"></p>

    <hr />
    <h3>Task 6: Reset Form</h3>
    <form id="Form6" novalidate>
      <input type="text" id="t6Name" placeholder="Enter name" />
      <span class="t6-error" id="t6NameError"></span>
      <br /><br />

      <input type="email" id="t6Email" placeholder="Enter email" />
      <span class="t6-error" id="t6EmailError"></span>
      <br /><br />

      <input type="password" id="t6Password" placeholder="Enter password" />
      <span class="t6-error" id="t6PasswordError"></span>
      <br /><br />

      <button type="submit">Submit</button>
      <button type="button" id="t6ResetBtn">Reset</button>
    </form>

    <p id="t6Success"></p>
  </body>
</html>
